name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Read versions
        id: versions
        run: |
          echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.versions.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${{ steps.versions.outputs.version }} in gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - uses: softprops/action-gh-release@v2
        with:
          name: AntiCreeper ${{ steps.versions.outputs.version }} for Minecraft ${{ steps.versions.outputs.mc }}
          body: |
            For Paper ${{ steps.versions.outputs.mc }} (Java 25).

            Download `AntiCreeper-${{ steps.versions.outputs.version }}-mc${{ steps.versions.outputs.mc }}.jar` below and put it in your server's `plugins` folder.
          files: build/libs/AntiCreeper-*.jar
